<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дневник питания</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header><h1>Дневник питания</h1></header>

  <nav>
    <ul>
      <li><a href="index.html">Калькулятор</a></li>
      <li><a href="diary.html" class="active">Дневник</a></li>
      <li><a href="products.html">Продукты</a></li>
      <li><a href="stats.html">Статистика</a></li>
      <li><a href="goals.html">Цели</a></li>
    </ul>
  </nav>

  <main>
    <p>Добавляйте съеденные продукты за сегодня. Данные сохраняются в
       <code>localStorage</code> браузера.</p>

    <form id="entryForm">
      <label>Дата
        <input type="date" id="entryDate" required />
      </label>

      <label>Продукт
        <select id="entryProduct" required></select>
      </label>

      <label>Вес порции (г)
        <input type="number" id="entryWeight" min="1" max="3000" value="100" required />
      </label>

      <label>Приём пищи
        <select id="entryMeal">
          <option>Завтрак</option>
          <option>Обед</option>
          <option>Ужин</option>
          <option>Перекус</option>
        </select>
      </label>

      <button type="submit">Добавить</button>
    </form>

    <h2>Записи</h2>
    <table id="entriesTable">
      <thead>
        <tr>
          <th>Дата</th><th>Приём</th><th>Продукт</th>
          <th>Вес, г</th><th>Ккал</th><th>Б</th><th>Ж</th><th>У</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <th colspan="4">Итого</th>
          <th id="sumKcal">0</th>
          <th id="sumP">0</th>
          <th id="sumF">0</th>
          <th id="sumC">0</th>
          <th></th>
        </tr>
      </tfoot>
    </table>

    <div id="dayProgress"></div>
  </main>

  <footer><p>© 2025 Дневник питания</p></footer>

  <script src="js/storage.js"></script>
  <script src="js/products.js"></script>
  <script src="js/diary.js"></script>
</body>
</html>
